<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WuWa Tower Planner</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- STEP 1: Pick your characters -->
        <section id="step-pick" class="step active">
            <div class="step-header">
                <h1>Pick Your Characters</h1>
                <p>Tap everyone you own. We'll build your teams.</p>
            </div>

            <div class="filter-bar">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="glacio">Glacio</button>
                <button class="filter" data-filter="fusion">Fusion</button>
                <button class="filter" data-filter="electro">Electro</button>
                <button class="filter" data-filter="aero">Aero</button>
                <button class="filter" data-filter="spectro">Spectro</button>
                <button class="filter" data-filter="havoc">Havoc</button>
            </div>

            <div class="char-grid" id="char-grid">
                <!-- Populated by JS -->
            </div>

            <div class="sticky-bottom">
                <div class="selected-count"><span id="count">0</span> selected</div>
                <button class="btn-go" id="btn-go" disabled>Show My Teams</button>
            </div>
        </section>

        <!-- STEP 2: Your teams -->
        <section id="step-teams" class="step">
            <div class="step-header">
                <button class="btn-back" id="btn-back">&larr; Change Characters</button>
                <h1>Your Tower Teams</h1>
                <p>Based on who you own, here's what to run.</p>
            </div>

            <div id="teams-output">
                <!-- Populated by JS -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
